<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知公告 - 数智方志</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="brand.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        .section { padding: 80px 0; }
        .page-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 700; margin-bottom: 40px; color: var(--brand-primary); text-align: center; position: relative; }
        .page-title::after { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:60px; height:3px; background:linear-gradient(90deg,var(--accent-gold),var(--accent-red)); border-radius:2px; }
        .notice-item {
            padding: 16px 24px; border-bottom: 1px solid var(--border-light);
            transition: all 0.2s ease; cursor: pointer;
            display: flex; align-items: flex-start; gap: 12px;
        }
        .notice-item:hover { background: var(--warm-ivory); }
        .notice-item:last-child { border-bottom: none; }
        .notice-item .date { color: var(--text-muted); font-size: 0.85rem; white-space: nowrap; min-width: 85px; }
        .notice-item .title { color: var(--text-primary); font-size: 1rem; }
        .notice-banner {
            position: relative;
            background: linear-gradient(160deg, #0A2C4A, #163E5F, #165D94);
            color: white; padding: 80px 0 60px; text-align: center; overflow: hidden;
        }
        .notice-banner::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 80%, rgba(184,134,11,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top brand-navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">📜 数智方志</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#library">方志库</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#resources">数字资源</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#graph">知识图谱</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#research">方智编研</a></li>
                <li class="nav-item"><a class="nav-link" href="team.html">团队成员</a></li>
                <li class="nav-item">
                    <button class="btn btn-sm btn-outline-light ms-2" data-bs-toggle="modal" data-bs-target="#loginModal">后台入口</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 页面标题 -->
<section class="notice-banner">
    <div class="container pt-4" style="position:relative;z-index:1;">
        <h1 class="display-4 fw-bold" style="font-family:var(--font-display);letter-spacing:0.06em;">通知公告</h1>
        <p class="lead mt-3" style="color:rgba(255,255,255,0.7);">最新平台动态与资讯</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="card-content" style="padding: 0; overflow: hidden;">
            <div class="notice-item">
                <span class="badge bg-danger">置顶</span>
                <span class="date">2026-02-28</span>
                <span class="title">《数智方志》平台正式上线试运行通知</span>
            </div>
            <div class="notice-item">
                <span class="badge bg-primary">公告</span>
                <span class="date">2026-02-25</span>
                <span class="title">方志库新增清代府志、县志共12种</span>
            </div>
            <div class="notice-item">
                <span class="badge bg-primary">公告</span>
                <span class="date">2026-02-20</span>
                <span class="title">知识图谱可视化模块正式开放</span>
            </div>
            <div class="notice-item">
                <span class="badge bg-primary">公告</span>
                <span class="date">2026-02-15</span>
                <span class="title">方智编研栏目开放使用</span>
            </div>
            <div class="notice-item">
                <span class="badge bg-primary">公告</span>
                <span class="date">2026-02-10</span>
                <span class="title">平台数据维护与功能升级通知</span>
            </div>
        </div>
    </div>
</section>

<footer class="brand-footer">
    <div class="container text-center">
        <h5 style="font-family:var(--font-serif);color:rgba(255,255,255,0.9);">📜 数智方志 · 数字人文研究平台</h5>
        <p class="mt-3">© 2026 版权所有 | 机构学术专用</p>
    </div>
</footer>

<!-- 后台登录弹窗 -->
<div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius:var(--radius-lg);border:1px solid var(--border-warm);">
            <div class="modal-header" style="background:var(--warm-ivory);border-bottom:1px solid var(--border-warm);">
                <h5 class="modal-title" style="font-family:var(--font-serif);color:var(--brand-primary);">数智方志 · 后台管理登录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3"><label>用户名</label><input type="text" class="form-control" placeholder="请输入管理员账号"></div>
                <div class="mb-3"><label>密码</label><input type="password" class="form-control" placeholder="请输入密码"></div>
            </div>
            <div class="modal-footer" style="border-top:1px solid var(--border-warm);">
                <button class="btn btn-brand-primary w-100">登录后台</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
