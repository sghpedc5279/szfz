<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队成员 - 数智方志</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="brand.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        .section { padding: 80px 0; }
        .page-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 700; margin-bottom: 40px; color: var(--brand-primary); text-align: center; position: relative; }
        .page-title::after { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:60px; height:3px; background:linear-gradient(90deg,var(--accent-gold),var(--accent-red)); border-radius:2px; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 0 auto 15px; border: 3px solid var(--border-warm); transition: transform 0.3s ease; }
        .card-primary:hover .avatar { transform: scale(1.05); border-color: var(--accent-gold); }
        .team-banner {
            position: relative;
            background: linear-gradient(160deg, #0A2C4A, #163E5F, #165D94);
            color: white; padding: 80px 0 60px; text-align: center; overflow: hidden;
        }
        .team-banner::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 50% 80%, rgba(184,134,11,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top brand-navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">📜 数智方志</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#library">方志库</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#resources">数字资源</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#graph">知识图谱</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#research">方智编研</a></li>
                <li class="nav-item"><a class="nav-link active" href="team.html">团队成员</a></li>
                <li class="nav-item">
                    <button class="btn btn-sm btn-outline-light ms-2" data-bs-toggle="modal" data-bs-target="#loginModal">后台入口</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 页面标题 -->
<section class="team-banner">
    <div class="container pt-4" style="position:relative;z-index:1;">
        <h1 class="display-4 fw-bold" style="font-family:var(--font-display);letter-spacing:0.06em;">团队成员</h1>
        <p class="lead mt-3" style="color:rgba(255,255,255,0.7);">数字人文研究团队</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <h2 class="page-title">研究团队</h2>
        <div class="row g-4 text-center">
            <div class="col-md-4">
                <div class="card-primary h-100">
                    <img src="https://picsum.photos/id/1/120/120" class="avatar" alt="头像">
                    <h5><a href="https://web.suda.edu.cn/dingjiayou/" target="_blank" style="text-decoration:none;color:var(--brand-deep);">丁家友</a></h5>
                    <p class="text-muted">项目负责人</p>
                    <p style="color:var(--text-secondary);">数字人文、历史文献研究</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-primary h-100">
                    <img src="https://picsum.photos/id/2/120/120" class="avatar" alt="头像">
                    <h5 style="color:var(--brand-deep);">李博士</h5>
                    <p class="text-muted">核心研究员</p>
                    <p style="color:var(--text-secondary);">方志文献整理与数字化</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-primary h-100">
                    <img src="https://picsum.photos/id/3/120/120" class="avatar" alt="头像">
                    <h5 style="color:var(--brand-deep);">王工程师</h5>
                    <p class="text-muted">数据工程师</p>
                    <p style="color:var(--text-secondary);">知识图谱、数据可视化</p>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="brand-footer">
    <div class="container text-center">
        <h5 style="font-family:var(--font-serif);color:rgba(255,255,255,0.9);">📜 数智方志 · 数字人文研究平台</h5>
        <p class="mt-3">© 2026 版权所有 | 机构学术专用</p>
    </div>
</footer>

<!-- 后台登录弹窗 -->
<div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius:var(--radius-lg);border:1px solid var(--border-warm);">
            <div class="modal-header" style="background:var(--warm-ivory);border-bottom:1px solid var(--border-warm);">
                <h5 class="modal-title" style="font-family:var(--font-serif);color:var(--brand-primary);">数智方志 · 后台管理登录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3"><label>用户名</label><input type="text" class="form-control" placeholder="请输入管理员账号"></div>
                <div class="mb-3"><label>密码</label><input type="password" class="form-control" placeholder="请输入密码"></div>
            </div>
            <div class="modal-footer" style="border-top:1px solid var(--border-warm);">
                <button class="btn btn-brand-primary w-100">登录后台</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
